<text x="50" y="1050" dominant-baseline="middle" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#17324d">Los 9 registros de otros métodos quedan como bibliografía de contexto, sin sumarse.</text>
