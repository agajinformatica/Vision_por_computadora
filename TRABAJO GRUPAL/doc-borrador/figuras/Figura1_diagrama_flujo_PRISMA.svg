<text x="50" y="1110" dominant-baseline="middle" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#17324d">Balance: 158 = 10 + 74 + 17 + 57. Los E5 se cuentan una sola vez, en recuperación.</text>
<text x="50" y="1150" dominant-baseline="middle" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#17324d">Fuente: CSV consolidado, PDF locales y CIERRE_AUDITADO.md · elaboración propia.</text>
