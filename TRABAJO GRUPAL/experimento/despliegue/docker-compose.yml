services:
  epp-yolo26:
    build: .
    container_name: epp-yolo26
    # Puerto 8090: verificado libre en el servidor el 2026-10-09.
    ports:
      - "8090:8090"
    volumes:
      - ./pesos:/app/pesos:ro
    environment:
      PESOS: /app/pesos/best.pt
      UMBRAL: "0.25"
    restart: unless-stopped
    # El stack existente del servidor no se toca: red propia, aislada.
    networks:
      - epp

networks:
  epp:
    driver: bridge
